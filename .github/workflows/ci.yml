name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: promptflow
          POSTGRES_PASSWORD: promptflow
          POSTGRES_DB: promptflow
        options: >-
          --health-cmd "pg_isready -U promptflow -d promptflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Линтинг Ruff
        run: ruff check .

      - name: Проверка форматирования Ruff
        run: ruff format --check .

      - name: Запуск тестов pytest
        env:
          SECRET_KEY: ci-secret-key
          DATABASE_URL: postgresql+psycopg2://promptflow:promptflow@localhost:5432/promptflow
        run: pytest -q
